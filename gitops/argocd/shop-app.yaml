# Argo CD watches helm/shop in your GitHub repo and keeps the cluster matching it.
# scripts/configure.sh replaces VenkatSevya/eks-gitops-platform with <your-user>/<your-repo>.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VenkatSevya/eks-gitops-platform.git
    targetRevision: main
    path: helm/shop
    helm:
      valueFiles:
        - values.yaml
        - values-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true     # delete what was removed from Git
      selfHeal: true  # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
