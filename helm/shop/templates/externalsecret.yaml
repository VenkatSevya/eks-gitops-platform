{{- if .Values.externalSecret.enabled }}
# The External Secrets controller reads AWS Secrets Manager using its EKS Pod Identity
# (no access keys stored anywhere) and writes the Kubernetes Secret "shop-db".
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-db
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: shop-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.remoteSecretName }}
        property: password
{{- end }}
