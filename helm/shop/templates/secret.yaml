{{- if not .Values.externalSecret.enabled }}
# Local only. On EKS this Secret is created by External Secrets from AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: shop-db
  labels:
    {{- include "shop.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.db.password | quote }}
{{- end }}
