# Overrides for EKS. Argo CD uses values.yaml + this file.
# Run scripts/configure.sh once to replace ACCOUNT_ID with your AWS account ID.
image:
  registry: ACCOUNT_ID.dkr.ecr.eu-north-1.amazonaws.com
  tag: latest   # updated automatically by CI after each build
  pullPolicy: IfNotPresent

externalSecret:
  enabled: true

monitoring:
  serviceMonitor: true
  sloRule: true
